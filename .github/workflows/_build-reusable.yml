name: Build (reusable)

# One job per platform+arch. This is mandatory: build-with-builder.js prepares
# the engine once using the FIRST --arch flag, so a multi-arch invocation ships
# an app with no engine and fails afterPack's bundle verification.
on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload build output as workflow artifacts
        type: boolean
        default: true
      release-tag:
        description: >-
          When set, upload build output as assets on this tag's DRAFT release
          instead of as workflow artifacts. Release assets do not count
          against the Actions artifact storage quota, which is what stalled
          the v2.2.0 train for a day: the artifact-mediated pipeline could
          not move installers from build to publish while the quota was
          exhausted. The draft release must already exist (release.yml's
          prepare job creates it) so six parallel jobs never race the create.
        type: string
        default: ''
      ref:
        description: >-
          Git ref to build. Required for workflow_dispatch: without it every
          checkout uses the ref the workflow was dispatched on, so asking for
          tag v2.1.53 from main builds main's version and the publish step then
          rejects its own artifacts.
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # channel-src / channel-dest: electron-updater channel files share
          # names across arches (both Windows jobs emit `latest.yml`, both
          # macOS jobs `latest-mac.yml`). Workflow artifacts kept them apart
          # by artifact directory; release assets share ONE namespace, so
          # each job renames its channel file to its published name before
          # uploading. The publish job consumes them as-is.
          - name: windows-x64
            runner: windows-latest
            artifact: windows-build-x64
            build: build-win:x64
            rust-target: x86_64-pc-windows-msvc
            channel-src: latest.yml
            channel-dest: latest.yml
          - name: windows-arm64
            runner: windows-11-arm
            artifact: windows-build-arm64
            build: build-win:arm64
            rust-target: aarch64-pc-windows-msvc
            channel-src: latest.yml
            channel-dest: latest-win-arm64.yml
          - name: macos-arm64
            runner: macos-14
            artifact: macos-build-arm64
            build: build-mac:arm64
            rust-target: aarch64-apple-darwin
            # macOS arm64 builds with the custom latest-arm64 channel, which
            # electron-updater resolves as latest-arm64-mac.yml.
            channel-src: latest-mac.yml
            channel-dest: latest-arm64-mac.yml
          - name: macos-x64
            runner: macos-15-intel
            artifact: macos-build-x64
            build: build-mac:x64
            rust-target: x86_64-apple-darwin
            channel-src: latest-mac.yml
            channel-dest: latest-mac.yml
          - name: linux-x64
            runner: ubuntu-latest
            artifact: linux-build-x64
            build: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            channel-src: latest-linux.yml
            channel-dest: latest-linux.yml
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: linux-build-arm64
            build: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
            channel-src: latest-linux-arm64.yml
            channel-dest: latest-linux-arm64.yml

    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      # Sentry stays disabled: no DSN is configured for Pavii builds.
      SENTRY_DSN: ''
      # The renderer bundle is ~10k modules and exceeds Node's default heap on
      # the smaller runners (macOS arm64 OOM'd at ~2 GB).
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux packaging deps
        if: startsWith(matrix.name, 'linux')
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm libarchive-tools

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A UTF-8 BOM or cp1252 mojibake in a shipped asset silently empties the
      # catalog that parses it. Catch it before anything is built.
      - name: Check file encodings
        run: node scripts/check-encoding.js

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: the-remaa/AionCore -> target
          key: ${{ matrix.name }}

      # Guards the embedded builtin-assistant manifest: a corrupt manifest
      # parses to an empty catalog at runtime instead of failing, so the only
      # place it surfaces is this test.
      - name: Verify engine assets
        working-directory: the-remaa/AionCore
        run: cargo test -p aionui-assistant builtin

      # The engine is built from the vendored source so every platform gets the
      # Pavii-branded binary (identity, prompts, embedded version info).
      - name: Build Pavii Engine (paviicore)
        working-directory: the-remaa/AionCore
        run: cargo build --release --bin paviicore

      - name: Locate engine binary
        shell: bash
        run: |
          BIN="the-remaa/AionCore/target/release/paviicore"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          test -f "$BIN" || { echo "engine binary missing at $BIN"; exit 1; }
          echo "AIONUI_BACKEND_LOCAL_BINARY=$(pwd)/$BIN" >> "$GITHUB_ENV"

      # bun (not npm): the 7zip-bin patch lives in bun's patchedDependencies and
      # is required for the macOS zip target.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ matrix.build }}" in
            linux-x64)   node scripts/build-with-builder.js x64 --linux --x64 ;;
            linux-arm64) node scripts/build-with-builder.js arm64 --linux --arm64 ;;
            *)           bun run ${{ matrix.build }} ;;
          esac

      # Quota-independent path: assets go straight onto the tag's draft
      # release, which the publish job downloads, verifies, and flips live.
      - name: Upload to draft release
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          CHANNEL_SRC: ${{ matrix.channel-src }}
          CHANNEL_DEST: ${{ matrix.channel-dest }}
        run: |
          set -euo pipefail
          # Publish-time channel name (see the matrix comment): rename before
          # upload so same-named channel files from sibling arches never
          # clobber each other in the release's single namespace.
          if [ "$CHANNEL_SRC" != "$CHANNEL_DEST" ]; then
            mv "out/$CHANNEL_SRC" "out/$CHANNEL_DEST"
          fi
          test -f "out/$CHANNEL_DEST" || { echo "channel file out/$CHANNEL_DEST missing"; exit 1; }

          shopt -s nullglob
          files=(out/Pavii.Ai-*.exe out/Pavii.Ai-*.exe.blockmap out/Pavii.Ai-*.dmg \
                 out/Pavii.Ai-*-mac-*.zip out/Pavii.Ai-*.deb out/Pavii.Ai-*.AppImage \
                 "out/$CHANNEL_DEST")
          [ "${#files[@]}" -ge 2 ] || { echo "no build output found in out/"; exit 1; }
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Upload artifacts
        if: inputs.upload-artifacts && inputs.release-tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            out/Pavii.Ai-*.exe
            out/Pavii.Ai-*.exe.blockmap
            out/Pavii.Ai-*.dmg
            out/Pavii.Ai-*-mac-*.zip
            out/Pavii.Ai-*.deb
            out/Pavii.Ai-*.AppImage
            out/latest*.yml

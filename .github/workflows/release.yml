name: Release

# Tag a version (e.g. `git tag v2.1.52 && git push --tags`) to build every
# target and publish a GitHub Release. electron-updater reads the uploaded
# latest*.yml channel files to offer in-app updates.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build-reusable.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Collect installers + rename the per-arch channel files so electron-updater
      # finds the right one (latest.yml, latest-mac.yml, latest-arm64-mac.yml, ...).
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name 'Pavii.Ai-*-mac-*.zip' \) -exec cp -n {} release/ \;

          copy_channel() { [ -f "$1" ] && cp "$1" "release/$2" || echo "note: missing $1"; }
          copy_channel artifacts/windows-build-x64/latest.yml        latest.yml
          copy_channel artifacts/windows-build-arm64/latest.yml      latest-win-arm64.yml
          # macOS ships arm64 only; latest-mac.yml is the channel file
          # electron-updater looks for by default, so arm64 supplies it.
          copy_channel artifacts/macos-build-arm64/latest-mac.yml    latest-mac.yml
          copy_channel artifacts/linux-build-x64/latest-linux.yml    latest-linux.yml
          copy_channel artifacts/linux-build-arm64/latest-linux-arm64.yml latest-linux-arm64.yml

          # Stable-named aliases so website links like
          # releases/latest/download/Pavii.Ai-Windows-x64-Setup.exe keep working.
          V="${{ steps.version.outputs.version }}"
          alias_of() { [ -f "release/$1" ] && cp "release/$1" "release/$2" || true; }
          alias_of "Pavii.Ai-$V-win-x64.exe"       "Pavii.Ai-Windows-x64-Setup.exe"
          alias_of "Pavii.Ai-$V-win-arm64.exe"     "Pavii.Ai-Windows-arm64-Setup.exe"
          alias_of "Pavii.Ai-$V-mac-arm64.dmg"     "Pavii.Ai-macOS-arm64.dmg"
          alias_of "Pavii.Ai-$V-linux-x64.AppImage"   "Pavii.Ai-Linux-x64.AppImage"
          alias_of "Pavii.Ai-$V-linux-arm64.AppImage" "Pavii.Ai-Linux-arm64.AppImage"
          alias_of "Pavii.Ai-$V-linux-x64.deb"     "Pavii.Ai-Linux-x64.deb"
          alias_of "Pavii.Ai-$V-linux-arm64.deb"   "Pavii.Ai-Linux-arm64.deb"

          ( cd release && sha256sum * > SHA256SUMS )
          ls -lh release

      # Every download button in the README points at
      # releases/latest/download/<stable-name>, so the release must contain one
      # asset per platform before it is published.
      - name: Verify one installer per platform is present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in Pavii.Ai-Windows-x64-Setup.exe Pavii.Ai-Windows-arm64-Setup.exe                    Pavii.Ai-macOS-arm64.dmg                    Pavii.Ai-Linux-x64.AppImage Pavii.Ai-Linux-arm64.AppImage                    Pavii.Ai-Linux-x64.deb Pavii.Ai-Linux-arm64.deb; do
            if [ -f "release/$f" ]; then echo "ok      $f"; else echo "MISSING $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Refusing to publish: a download button would 404."; exit 1; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Pavii.Ai $VERSION" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" release/* --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
